name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      godot_version:
        description: "Godot version (e.g. 4.7.2-stable)"
        required: false
        default: "4.7.2-stable"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Godot version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.godot_version || '4.7.2-stable' }}"
          echo "godot_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "template_dir=${VERSION//-/.}" >> "$GITHUB_OUTPUT"

      - name: Download Godot & iOS Export Templates
        run: |
          VER="${{ steps.ver.outputs.godot_version }}"
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/${{ steps.ver.outputs.template_dir }}"
          mkdir -p "$TPL_DIR"

          curl -fL "https://github.com/godotengine/godot/releases/download/${VER}/Godot_v${VER}_macos.universal.zip" -o godot.zip
          unzip -q godot.zip -d /tmp/godot_app
          echo "GODOT_BIN=/tmp/godot_app/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

          curl -fL "https://github.com/godotengine/godot/releases/download/${VER}/Godot_v${VER}_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TPL_DIR/"

      - name: Cache PocketPartyBLE iOS binary
        id: cache-ble
        uses: actions/cache@v4
        with:
          path: addons/ble_ios/bin
          key: ios-ble-v2-godot45-${{ hashFiles('addons/ble_ios/src/**', 'addons/ble_ios/SConstruct') }}

      - name: Build PocketPartyBLE iOS GDExtension
        run: |
          mv addons/ble_ios/PocketPartyBLE.gdextension.ios addons/ble_ios/PocketPartyBLE.gdextension
          if [ "${{ steps.cache-ble.outputs.cache-hit }}" != "true" ]; then
            python3 -m venv /tmp/scons_venv
            /tmp/scons_venv/bin/pip install --quiet scons
            git clone --depth 1 --branch 4.5 https://github.com/godotengine/godot-cpp.git addons/ble_ios/godot-cpp
            mkdir -p addons/ble_ios/bin
            /tmp/scons_venv/bin/scons -C addons/ble_ios platform=ios target=template_release arch=arm64 -j$(sysctl -n hw.ncpu)
            libtool -static -o addons/ble_ios/bin/libPocketPartyBLE_merged.a \
              addons/ble_ios/bin/libPocketPartyBLE.ios.template_release.arm64.a \
              addons/ble_ios/godot-cpp/bin/libgodot-cpp.ios.template_release.arm64.a
            mv addons/ble_ios/bin/libPocketPartyBLE_merged.a addons/ble_ios/bin/libPocketPartyBLE.ios.template_release.arm64.a
          else
            echo "Using cached libPocketPartyBLE.ios.template_release.arm64.a"
          fi

      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "iOS" build/ios/PocketParty.xcodeproj

      - name: Add Bluetooth Privacy Descriptions to Info.plist
        run: |
          for PLIST in $(find build/ios -name "*Info.plist"); do
            echo "Patching plist: $PLIST"
            /usr/libexec/PlistBuddy -c "Delete :NSBluetoothAlwaysUsageDescription" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Pocket Party uses Bluetooth to connect with nearby players.'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Delete :NSBluetoothPeripheralUsageDescription" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Pocket Party uses Bluetooth to join nearby game tables.'" "$PLIST"
          done

      - name: Build Unsigned .app with xcodebuild
        run: |
          xcodebuild \
            -project build/ios/PocketParty.xcodeproj \
            -scheme PocketParty \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS="\$(inherited) -framework CoreBluetooth -Wl,-force_load,${GITHUB_WORKSPACE}/addons/ble_ios/bin/libPocketPartyBLE.ios.template_release.arm64.a" \
            build
          nm -gU build/derived/Build/Products/Release-iphoneos/PocketParty.app/PocketParty | grep pocket_party_ble_library_init

      - name: Package Unsigned .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/derived/Build/Products/Release-iphoneos/PocketParty.app build/ipa/Payload/
          APP_PLIST="build/ipa/Payload/PocketParty.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothAlwaysUsageDescription" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Pocket Party uses Bluetooth to connect with nearby players.'" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSBluetoothPeripheralUsageDescription" "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Pocket Party uses Bluetooth to join nearby game tables.'" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$APP_PLIST"
          cd build/ipa
          zip -qry ../../PocketParty-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketParty-unsigned-ipa
          path: PocketParty-unsigned.ipa
